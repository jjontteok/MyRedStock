<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RedStock Briefing</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: #171717;
    }
    main {
      width: min(560px, calc(100% - 32px));
      background: #fff;
      border: 1px solid #e4e7ec;
      border-radius: 8px;
      padding: 28px;
    }
    .brand {
      color: #d92035;
      font-weight: 800;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      letter-spacing: 0;
    }
    p {
      margin: 0;
      color: #666f7a;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">RedStock</div>
    <h1>브리핑 준비 중</h1>
    <p>GitHub Actions가 실행되면 이 페이지가 오늘의 주식 뉴스 브리핑으로 업데이트됩니다.</p>
  </main>
</body>
</html>
