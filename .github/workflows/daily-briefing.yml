name: Daily stock Kakao briefing

on:
  schedule:
    # Wake up often; send_briefing.py checks the user-selected KST send time.
    - cron: "*/10 * * * *"
    # Extra offsets help when GitHub drops or delays crowded 10-minute boundaries.
    - cron: "3-59/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send Kakao briefing
        env:
          GOOGLE_SHEET_CSV_URL: ${{ secrets.GOOGLE_SHEET_CSV_URL }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          PUBLIC_BRIEFING_URL: ${{ vars.PUBLIC_BRIEFING_URL }}
          WATCHLIST_API_URL: ${{ vars.WATCHLIST_API_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python send_briefing.py

      - name: Publish briefing page
        if: success() && hashFiles('docs/index.html') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Update daily briefing page"
          git push
